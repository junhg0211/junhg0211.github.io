name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_pages: ${{ steps.new_pages.outputs.pages }}
    env:
      # Define tool versions
      DART_SASS_VERSION: 1.104.0
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.20.0

      # Set the build time zone
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v sass &> /dev/null && echo "Dart Sass: $(sass --version)" || echo "Dart Sass: not installed"
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Identify newly published pages
        id: new_pages
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A first-ever push has no comparable commit, so it deliberately sends no alerts.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo 'pages=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_site="${RUNNER_TEMP}/previous-site"
          git worktree add --detach "$previous_site" "$BEFORE"
          trap 'git worktree remove --force "$previous_site"' EXIT

          if [[ -f "$previous_site/.gitmodules" ]]; then
            git -C "$previous_site" submodule update --init --recursive
          fi

          # Use one clock for both revisions so a date boundary cannot create a false difference.
          clock="$(date --iso-8601=seconds)"
          hugo list published --clock "$clock" > "${RUNNER_TEMP}/current-pages.csv"
          (
            cd "$previous_site"
            hugo list published --clock "$clock"
          ) > "${RUNNER_TEMP}/previous-pages.csv"

          git diff --name-only "$BEFORE" "$GITHUB_SHA" -- content > "${RUNNER_TEMP}/changed-content.txt"

          python3 - \
            "${RUNNER_TEMP}/current-pages.csv" \
            "${RUNNER_TEMP}/previous-pages.csv" \
            "${RUNNER_TEMP}/changed-content.txt" \
            > "${RUNNER_TEMP}/new-pages.json" <<'PY'
          import csv
          import json
          import re
          import sys

          current_csv, previous_csv, changed_file = sys.argv[1:]

          def read_pages(filename):
              with open(filename, newline='', encoding='utf-8') as handle:
                  return {row['path']: row for row in csv.DictReader(handle)}

          current = read_pages(current_csv)
          previous = read_pages(previous_csv)
          with open(changed_file, encoding='utf-8') as handle:
              changed = {line.strip() for line in handle if line.strip()}

          post_path = re.compile(r'content/\d{4}/\d{2}/.+\.md')
          newly_published = []
          for path in sorted(changed):
              page = current.get(path)
              if page and path not in previous and post_path.fullmatch(path):
                  newly_published.append({
                      'path': path,
                      'title': page['title'],
                      'url': page['permalink'],
                  })

          print(json.dumps(newly_published, ensure_ascii=False, separators=(',', ':')))
          PY

          echo "pages=$(<"${RUNNER_TEMP}/new-pages.json")" >> "$GITHUB_OUTPUT"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: >-
      github.event_name == 'push' &&
      github.run_attempt == '1' &&
      needs.deploy.result == 'success' &&
      needs.build.outputs.new_pages != '' &&
      needs.build.outputs.new_pages != '[]'
    steps:
      - name: Send newly published posts to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEW_PAGES: ${{ needs.build.outputs.new_pages }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL')
          if not webhook_url:
              raise SystemExit('DISCORD_WEBHOOK_URL is not configured.')

          pages = json.loads(os.environ['NEW_PAGES'])
          for page in pages:
              payload = json.dumps({
                  'embeds': [{
                      'title': page['title'],
                      'url': page['url'],
                      'description': '새 글이 게시되었습니다.',
                  }]
              }, ensure_ascii=False).encode('utf-8')

              for attempt in range(3):
                  request = urllib.request.Request(
                      webhook_url,
                      data=payload,
                      headers={'Content-Type': 'application/json'},
                      method='POST',
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status not in (200, 204):
                              raise RuntimeError(f'Discord returned HTTP {response.status}.')
                      break
                  except (urllib.error.URLError, urllib.error.HTTPError, RuntimeError):
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          PY
