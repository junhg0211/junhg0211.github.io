name: Create Hugo Content

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Content subject"
        required: true
        type: string

jobs:
  create-content:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Create Hugo content
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          hugo new "content/$YEAR/$MONTH/${{ inputs.subject }}.md"

      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Create ${{ inputs.subject }}" || exit 0
          git push
