{{ define "main" }}
<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--grey);
    margin-bottom: 24px;
  "
>
  <div style="font-size: 32px; font-weight: bold">{{ .Title }}</div>
  <div style="min-width: 150px; text-align: right">{{ .Date.Format "2006-01-02" }}</div>
</div>
{{ .Content }} {{ end }}
