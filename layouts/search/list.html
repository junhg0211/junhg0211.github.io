{{ define "main" }}
<section class="search-page" aria-labelledby="search-title">
  <h1 id="search-title">글 검색</h1>
  <form class="search-page-form" action="{{ "search/" | relURL }}" method="get" role="search">
    <label class="visually-hidden" for="search-query">검색어</label>
    <input id="search-query" name="q" type="search" placeholder="제목, 내용, 태그로 검색" autocomplete="off" style="border-radius: 9999px; padding-left: 12px" />
    <button type="submit">검색</button>
  </form>
  <p id="search-status" class="search-status" role="status"></p>
  <div id="search-results" class="search-results" aria-live="polite"></div>
  <noscript><p>검색을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
</section>

{{ with resources.Get "js/search.js" | minify | fingerprint }}
  <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{ end }}
{{ end }}
