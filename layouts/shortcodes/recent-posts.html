{{ $posts := .Site.RegularPages }} {{ $recentPosts := first 3 (sort $posts "Date" "desc") }}

<div style="margin-top: 20px">
  {{ range $recentPosts }}
  <div style="margin-bottom: 10px">
    <div>
      <a href="{{ .RelPermalink }}">
        {{ .Title }}
        <small><time>{{ (time.In "Asia/Seoul" .Date).Format "2006-01-02" }}</time></small>
      </a>
    </div>
    <div>{{ .Summary | plainify | truncate 120 }}</div>
  </div>
  {{ end }}
</div>
