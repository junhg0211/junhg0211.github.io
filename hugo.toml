baseURL = 'https://me.shtelo.org/'
locale = 'ko-kr'
timeZone = 'Asia/Seoul'
enableEmoji = true
title = 'Zasoque'

[module]
  [module.mounts]
    source = 'content'
    target = 'content'
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style = 'darcula'
  [markup.tableOfContents]
    endLevel = 5
    ordered = true
    startLevel = 2
[params]
  math = true
[taxonomies]
  category = 'categories'
